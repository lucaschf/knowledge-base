          - Stringly-Typed Code: modelagem-de-dominio/code-smells/stringly-typed.md
          - Boolean Blindness: modelagem-de-dominio/code-smells/boolean-blindness.md
          - Temporal Coupling: modelagem-de-dominio/code-smells/temporal-coupling.md
          - Anemic Domain Model: modelagem-de-dominio/code-smells/anemic-domain-model.md
          - Feature Envy: modelagem-de-dominio/code-smells/feature-envy.md
          - Data Clumps: modelagem-de-dominio/code-smells/data-clumps.md
          - Shotgun Surgery: modelagem-de-dominio/code-smells/shotgun-surgery.md
